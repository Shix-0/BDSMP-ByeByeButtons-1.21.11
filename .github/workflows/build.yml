name: Build BDSMP mod
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Unpack source
        run: unzip -o BDSMP-ByeByeButtons-1.21.11-source.zip -d source
      - name: Build mod
        run: gradle -p source build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bdsmp-bye-bye-buttons-1.21.11
          path: source/build/libs/*.jar
